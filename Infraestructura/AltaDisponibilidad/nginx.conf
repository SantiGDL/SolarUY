worker_processes 1;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    # OIDC guarda tokens en la cookie de autenticación, que puede estar fragmentada.
    # Los servicios locales comparten cookies de localhost aunque cambie el puerto.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # No registrar query string, códigos OIDC, cookies ni tokens.
    log_format instancia '$time_iso8601 $request_method $uri status=$status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /dev/stdout instancia;
    # Los errores pueden incluir URLs completas; evitar registrar callbacks OIDC.
    error_log /dev/stderr crit;

    # Aca defino el comportamiento Activo-Pasivo del servidor
    upstream solaruy {
        server solaruy1:8080 max_fails=1 fail_timeout=5s;
        server solaruy2:8080 backup;
    }

    server {
        listen 80;
        server_name localhost;
        location / {
            proxy_pass http://solaruy;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
